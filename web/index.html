<!DOCTYPE html>
<html lang="zh-Hant">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>阿特雙拼輸入法 — 互動教學</title>
<link rel="stylesheet" href="style.css">
</head>
<body>
<div class="app">

  <aside class="sidebar">
    <header class="brand">
      <div class="brand-badge">特</div>
      <div>
        <h1>阿特雙拼輸入法</h1>
        <p>互動教學</p>
      </div>
    </header>
    <nav id="nav" class="nav"></nav>
    <footer class="side-foot">
      <div class="legend">
        <span><i class="lg lg-init"></i>聲母注音</span>
        <span><i class="lg lg-final"></i>韻母注音</span>
        <span><i class="lg lg-ctrl"></i>控制鍵</span>
      </div>
      <a href="https://github.com/weiwei84530/art-shuangpin" target="_blank" rel="noopener">GitHub</a>
      <a href="https://github.com/weiwei84530/art-shuangpin/blob/main/docs/spec.md" target="_blank" rel="noopener">完整規格</a>
    </footer>
  </aside>

  <main class="main">

    <section class="screen-wrap">
      <div class="notepad">
        <div class="np-title">
          <span class="np-doc">未命名 - 記事本</span>
          <span class="np-btns"><i>─</i><i>□</i><i>✕</i></span>
        </div>
        <div class="np-body" id="npBody">
          <span id="committed"></span><span id="composition"></span>
          <div id="candCard" class="cand-card" hidden></div>
        </div>
        <div class="np-status">
          <span id="modeBadge" class="mode-badge zh">中</span>
          <span id="modeHint">中文模式</span>
          <span class="np-right">UTF-8　第 1 行</span>
        </div>
      </div>
    </section>

    <section class="drill-bar" id="drillBar" hidden>
      <div class="drill-head">
        <div class="drill-title" id="drillTitle"></div>
        <div class="drill-meter"><i id="drillFill"></i></div>
        <span class="drill-count" id="drillCount"></span>
        <button id="btnDrillSound" title="按錯有提示聲（點一下關掉）">🔊</button>
        <button id="btnDrillRestart" title="從頭再來">↻</button>
      </div>
      <p class="drill-intro" id="drillIntro"></p>
      <div class="drill-text" id="drillText"></div>
      <div class="drill-next" id="drillNext"></div>
      <p class="drill-warn">練習時請先把真的輸入法切成英文（或關閉），否則按鍵會被輸入法吃掉，這個頁面收不到。按錯不會前進，也不會標記出來，只會發出一聲提示音（右上角可以關掉）。</p>
    </section>

    <section class="caption-bar" id="captionBar">
      <div class="controls">
        <button id="btnPrev" title="上一步">⏮</button>
        <button id="btnPlay" title="播放 / 暫停">▶</button>
        <button id="btnNext" title="下一步">⏭</button>
        <button id="btnRestart" title="重新播放">↻</button>
      </div>
      <div class="caption">
        <div class="cap-step" id="capStep"></div>
        <div class="cap-text" id="capText">選擇左側的教學開始。</div>
      </div>
    </section>

    <section class="kb-stage" id="kbStage">
      <div class="kb-tilt" id="kbTilt">
        <div class="kb-body" id="kbBody"></div>
      </div>
      <div class="kb-hint">按住滑鼠拖曳可轉動鍵盤</div>
    </section>

  </main>
</div>
<script src="tutorials.js"></script>
<script src="drills.js"></script>
<script src="app.js"></script>
</body>
</html>
